name: CI Pipeline

on:
  push:
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main ]

jobs:
  lint:
    name: PHP Lint
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'

    - name: Run PHP Lint
      run: |
        echo "=== Running PHP Lint ==="
        find . -name "*.php" -not -path "./vendor/*" -exec php -l {} \;
        echo "=== Lint complete ==="

  test:
    name: PHP Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'

    - name: Run Tests
      run: |
        echo "=== Running Tests ==="
        cd tests && php test_jugar.php
        echo "=== Tests complete ==="
