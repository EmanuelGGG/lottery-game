# ============================================================
# php-lint.yml - Pipeline de Integración Continua (CI)
#
# Este workflow de GitHub Actions se ejecuta automáticamente en:
# - Cada push a las ramas master, main o develop
# - Cada pull request dirigido a master o main
#
# Contiene 2 jobs que se ejecutan secuencialmente:
# 1. lint: Verifica la sintaxis de todos los archivos PHP
# 2. test: Ejecuta las pruebas automatizadas del juego
#
# El job 'test' depende del job 'lint' (needs: lint),
# por lo que solo se ejecuta si el lint pasa exitosamente.
#
# @package LotteryGame
# @version 1.1
# ============================================================

name: CI Pipeline

# Define los eventos que disparan la ejecución del workflow
on:
  push:
    branches: [ master, main, develop ]   # Se ejecuta al hacer push en estas ramas
  pull_request:
    branches: [ master, main ]            # Se ejecuta al crear/actualizar un PR

jobs:
  # -----------------------------------------------------------
  # JOB 1: PHP Lint
  # Verifica la sintaxis de todos los archivos .php del proyecto
  # usando el linter nativo de PHP (php -l)
  # -----------------------------------------------------------
  lint:
    name: PHP Lint
    runs-on: ubuntu-latest               # Ejecuta en la última versión de Ubuntu
    steps:
    # Paso 1: Descarga el código del repositorio al runner
    - name: Checkout repository
      uses: actions/checkout@v4

    # Paso 2: Instala PHP 8.2 en el runner usando la acción de shivammathur
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'

    # Paso 3: Ejecuta php -l en cada archivo .php del proyecto
    # El comando 'find' busca todos los .php excluyendo vendor/
    # php -l analiza la sintaxis sin ejecutar el código
    - name: Run PHP Lint
      run: |
        echo "=== Running PHP Lint ==="
        find . -name "*.php" -not -path "./vendor/*" -exec php -l {} \;
        echo "=== Lint complete ==="

  # -----------------------------------------------------------
  # JOB 2: PHP Tests
  # Ejecuta las pruebas automatizadas del método jugar()
  # Solo se ejecuta si el job 'lint' fue exitoso (needs: lint)
  # -----------------------------------------------------------
  test:
    name: PHP Tests
    runs-on: ubuntu-latest
    needs: lint                          # Depende del job lint: solo corre si lint pasó
    steps:
    # Paso 1: Descarga el código del repositorio
    - name: Checkout repository
      uses: actions/checkout@v4

    # Paso 2: Instala PHP 8.2
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'

    # Paso 3: Ejecuta el script de pruebas test_jugar.php
    # El script contiene 6 assertions que verifican la lógica del juego
    # Si alguna prueba falla, el script retorna exit code 1 y el job falla
    - name: Run Tests
      run: |
        echo "=== Running Tests ==="
        cd tests && php test_jugar.php
        echo "=== Tests complete ==="
